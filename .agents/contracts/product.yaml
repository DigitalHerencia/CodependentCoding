schema_version: 2
id: loaded-vibes.product
authority: machine-contract
sources:
  - context/docs/prd.md
  - context/docs/design.md

product:
  name: Loaded Vibes
  class: opinionated-saas-generator
  primary_value: time-saved-and-product-fit
  upstream_template_reference: DigitalHerencia/Vibes
  surfaces:
    - cli
    - web-configurator
    - loadedvibes-json
    - generated-application

priorities:
  - user-value
  - cli-and-web-ux
  - generated-product-fit
  - maintainable-generation
  - proportional-safety

presets:
  required_initial:
    - b2b-saas
    - client-portal
    - platform-marketplace
    - bare-golden-app

commands:
  target:
    - create
    - add
    - doctor
    - explain
    - preset-validate
    - preset-print
    - version

web:
  initial_mode: stateless
  requires_auth: false
  requires_database: false
  outputs:
    - cli-command
    - loadedvibes-json

prohibited_product_drift:
  - generic-framework-generator
  - arbitrary-stack-selector
  - enterprise-governance-platform
  - hosted-project-control-plane
  - plugin-marketplace-v1
  - mandatory-telemetry
  - automatic-provider-secret-collection
  - arbitrary-generated-repo-upgrade-engine
  - validation-as-primary-product
