schema_version: 7
id: codependent-coding.product
authority: machine-contract
sources:
  - context/00-governance/00-TypeScripture-Canonical-Doctrine.md
  - context/00-governance/02-Canonical-System-Manifest.md
  - context/00-governance/04-Segmented-Build-Spec.md
  - context/00-governance/05-Mockup-to-Function-Contract.md

product:
  name: The Codependent Coding Web App Architecture
  class: governed-web-application-architecture
  framing: doctrine-to-deterministic-generated-source

ecosystem:
  doctrine: TypeScripture
  resolver_generator_cli: Hipster Stack
  source_superset: Maximal Template
  normalized_defaults: Ontology
  web_workbench: Anthimeria
  resolved_definition: Virgule
  generated_artifact: Arrangement
  post_generation_operations: Loaded Vibes
  presentation_system: Visual Vibes

simples:
  families:
    - PureUI Blocks
    - BusinessLogic Blocks
  constituents_are_top_level_simples: false

web:
  package: apps/web
  stateless: true
  requires_auth: false
  requires_database: false
  hosted_generation_required: false
  routes:
    product: /
    ontologies: /ontologies
    simples: /simples
    docs: /docs
    anthimeria: /anthimeria
    maximal: /maximal
  compatibility_redirects:
    /libraries: /simples
    /configure: /anthimeria
  navigation: [Ontologies, Simples, Anthimeria, Maximal]
  mockups_control_presentation: true
  shared_resolver_controls_semantics: true

configuration:
  one_contract_for_cli_web_file: true
  normalized_starting_points: 9
  visible_options_must_change_supported_output: true
  dependency_closure_is_resolver_owned: true

prohibited_product_drift:
  - duplicate-web-configuration-engine
  - arbitrary-workflow-constituent-toggles
  - multiple-active-maximal-templates
  - loaded-vibes-as-generator
  - hosted-project-control-plane
  - configurator-account-system
