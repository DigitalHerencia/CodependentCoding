schema_version: 2
id: loaded-vibes.validation
authority: machine-contract
sources:
  - context/docs/tech-req.md
  - AGENTS.md

principle: proportional-verification

claim_rules:
  unexecuted_check_may_be_reported_as_passed: false
  previous_result_may_be_presented_as_current_execution: false

ordinary_issue:
  expectation:
    - verify-the-user-visible-behavior-changed
    - run-relevant-static-or-focused-tests-when-useful
  not_automatically_required:
    - full-generated-app-validation
    - full-playwright-matrix
    - provider-backed-tests
    - release-validation
    - deployment-validation
    - unrelated-test-suites

release_issue:
  may_require:
    - build
    - package-content-check
    - packed-cli-smoke-generation
    - focused-generated-output-smoke

rule: do-not-create-or-run-validation-work-unrelated-to-the-current-issue
