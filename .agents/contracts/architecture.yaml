schema_version: 2
id: loaded-vibes.architecture
authority: machine-contract
sources:
  - context/docs/architecture.md
  - context/docs/tech-req.md

recipe_core:
  single_schema: true
  consumers:
    - cli
    - web-configurator
    - config-file
  owns:
    - normalization
    - presets
    - module-resolution
    - generation-plan
  must_not_depend_on:
    - terminal-ui
    - nextjs-web-ui

repository_target:
  apps:
    - web
  packages:
    - cli
    - core
    - recipes
    - schema
  templates:
    - golden
    - modules

modules:
  repository_owned: true
  third_party_plugin_framework_v1: false
  resolve_prerequisites_automatically: true
  required_contract:
    - id
    - requires
    - conflicts
    - contributions

generated_application:
  upstream_reference: DigitalHerencia/Vibes
  preserve_application_grammar: true
  preserve_auth_tenancy_provider_boundaries: true

safety:
  collect_provider_secrets: false
  overwrite_unrelated_nonempty_target: false
  unsafe_shell_interpolation: false
  windows_first_class: true
