name: Spec / planned work
description: One spec or sub-issue from context/specs (setup, features, tests, reviews, docs).
title: "[ENG-M#-P#.#-CYCLE-T##] <Dev cycle> – <Spec title>"
labels:
  - tracked
  - type:feature
body:
  - type: markdown
    attributes:
      value: >-
        The JSON spec in `context/specs/` is the source of truth; prefer `pnpm governance:publish`.
        Use this form only for a spec or sub-issue that the scripts did not create.
  - type: input
    id: spec_id
    attributes:
      label: Spec ID
      description: The parent spec ID, or the sub-issue ID (parent ID plus `.N`).
      placeholder: ENG-M2-P2.1-FEATURES-T01.3
    validations:
      required: true
  - type: dropdown
    id: cadence
    attributes:
      label: Cadence
      options:
        - once
        - repeatable
        - expandable
        - gate
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective and scope
      description: What this delivers and what it explicitly excludes.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable conditions. One per line.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Commands and manual checks that prove the criteria.
      placeholder: pnpm lint, pnpm typecheck, pnpm test
    validations:
      required: true
  - type: textarea
    id: documentation
    attributes:
      label: Doc sections
      description: The context/docs sections that feed this work.
      placeholder: context/docs/PRD.md#functional-requirements
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: ENG-M2-P2.1-MVP-T05
