name: Governance structure
on:
  pull_request:
    paths:
      - 'context/**'
      - '.agents/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/labels.json'
      - '.github/milestones.json'
      - '.github/project.json'
      - 'scripts/governance/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate specification traceability (read-only)
        run: node scripts/governance/validate.mjs
