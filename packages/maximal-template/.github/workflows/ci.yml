# Included in generated apps. Lean, read-only PR checks; no builds/tests/deploys.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Changed-file checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine changed files
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.txt"
          if [[ -s "$RUNNER_TEMP/changed.txt" ]]; then
            echo 'any=true' >> "$GITHUB_OUTPUT"
          else
            echo 'any=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '\.(ts|tsx|js|jsx|mjs|cjs|prisma)$|^(package\.json|pnpm-lock\.yaml|tsconfig\.json|next\.config\.[cm]?[jt]s|prisma\.config\.ts)$' "$RUNNER_TEMP/changed.txt"; then
            echo 'types=true' >> "$GITHUB_OUTPUT"
          else
            echo 'types=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.any == 'true'
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.any == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        if: steps.changes.outputs.any == 'true'
        run: pnpm install --frozen-lockfile
      - name: Check formatting and lint changed files
        if: steps.changes.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/changed.txt"
          pnpm exec prettier --check --ignore-unknown "${files[@]}"
          mapfile -t code < <(grep -E '\.(js|jsx|ts|tsx|mjs|cjs|mts|cts)$' "$RUNNER_TEMP/changed.txt" || true)
          if (("${#code[@]}")); then pnpm exec eslint --max-warnings=0 "${code[@]}"; fi
      - name: Typecheck
        if: steps.changes.outputs.types == 'true'
        run: pnpm typecheck
