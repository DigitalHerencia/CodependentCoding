packages: []
# Keep validation commands read-only when dependencies need installing.
verifyDepsBeforeRun: error
# Supply chain (CC-047): skip versions younger than 7 days, refuse a dependency whose
# publish trust drops, and never write the package-manager env document into the lockfile.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
pmOnFail: ignore
# Exact versions whose publish evidence is weaker than an earlier release of the same
# package. Each is pinned by our dependency tree; review on every upgrade and drop the
# entry once the pinned version moves. prisma 7.10.x is published by prismabot with a
# token, while 7.9.0 used GitHub trusted publishing with provenance.
trustPolicyExclude:
  - "@vercel/cli-config@0.2.4"
  - "@vercel/cli-exec@1.0.1"
  - "@vercel/oidc@3.8.5"
  - eslint-import-resolver-typescript@3.10.1
  - prisma@7.10.1
  - semver@6.3.1
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - react-resizable-panels@4.12.4 || 4.18.1
  - "@clerk/backend@3.27.0"
  - "@clerk/nextjs@7.9.25"
  - "@clerk/react@6.18.6"
  - "@clerk/shared@4.44.1"
  - "@hookform/resolvers@7.0.3"
  - "@next/env@16.4.5"
  - "@next/eslint-plugin-next@16.4.5"
  - "@next/swc-darwin-arm64@16.4.5"
  - "@next/swc-darwin-x64@16.4.5"
  - "@next/swc-linux-arm64-gnu@16.4.5"
  - "@next/swc-linux-arm64-musl@16.4.5"
  - "@next/swc-linux-x64-gnu@16.4.5"
  - "@next/swc-linux-x64-musl@16.4.5"
  - "@next/swc-win32-arm64-msvc@16.4.5"
  - "@next/swc-win32-x64-msvc@16.4.5"
  - "@tailwindcss/node@4.3.4"
  - "@tailwindcss/oxide-android-arm64@4.3.4"
  - "@tailwindcss/oxide-darwin-arm64@4.3.4"
  - "@tailwindcss/oxide-darwin-x64@4.3.4"
  - "@tailwindcss/oxide-freebsd-x64@4.3.4"
  - "@tailwindcss/oxide-linux-arm-gnueabihf@4.3.4"
  - "@tailwindcss/oxide-linux-arm64-gnu@4.3.4"
  - "@tailwindcss/oxide-linux-arm64-musl@4.3.4"
  - "@tailwindcss/oxide-linux-x64-gnu@4.3.4"
  - "@tailwindcss/oxide-linux-x64-musl@4.3.4"
  - "@tailwindcss/oxide-wasm32-wasi@4.3.4"
  - "@tailwindcss/oxide-win32-arm64-msvc@4.3.4"
  - "@tailwindcss/oxide-win32-x64-msvc@4.3.4"
  - "@tailwindcss/oxide@4.3.4"
  - "@tailwindcss/postcss@4.3.4"
  - "@upstash/redis@1.41.0"
  - "@vitest/mocker@5.1.0"
  - "@vitest/spy@5.1.0"
  - eslint-config-next@16.4.5
  - eslint@10.14.0
  - lucide-react@1.69.0
  - next@16.4.5
  - stripe@23.1.0
  - tailwindcss@4.3.4
  - vitest@5.1.0
  - ws@8.22.1
