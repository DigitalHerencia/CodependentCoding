architecture:
  context_and_scope:
    source: context/docs/Architecture.md#context-and-scope
    users: []
    external_systems: []
  constraints:
    source: context/docs/Architecture.md#constraints
    constraints:
      - server-first; data access only on the server
      - tenancy and authorization enforced in the server layer and the database
  building_blocks:
    source: context/docs/Architecture.md#building-blocks
    layers:
      - layer: routes
        directory: app/
        responsibility: routing and composition only
      - layer: features
        directory: features/
        responsibility: feature UI and view logic
      - layer: components
        directory: components/
        responsibility: shared UI primitives
      - layer: server
        directory: lib/
        responsibility: actions, fetchers, auth, authz, db, integrations
      - layer: schemas
        directory: schemas/
        responsibility: input and output validation
      - layer: content
        directory: content/
        responsibility: copy and static content
  module_composition:
    source: context/docs/Architecture.md#module-composition
    modules:
