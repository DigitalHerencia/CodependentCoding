        relations: []
        tenant_column: organizationId
        constraints: []
        rls: true
  runtime_flows:
    source: context/docs/Architecture.md#runtime-flows
    read: route → fetcher → authz → database
    write: form → server action → schema validation → authz → database → revalidate
    flows: []
  integration_boundaries:
    source: context/docs/Architecture.md#integration-boundaries
