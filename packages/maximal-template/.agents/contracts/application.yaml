# Machine-readable mirror of the docs listed in derived_from. Each block's `source` is the doc section it translates.
schema_version: "1.1"
kind: agent_contract
id: application
status: template
status_values:
  - template
  - draft
  - approved
status_note: template until the owner approves the docs; then draft → approved. Agents must not build from a template contract.
responsibility:
  "What to build and how it is structured: product, technical and architecture intent, plus identity and access
  rules."
derived_from:
  - context/docs/PRD.md
  - context/docs/tech-requirements.md
  - context/docs/Architecture.md
  - context/docs/AUTH.md
rules:
  - id: APP-001
    statement: Every change implements exactly one spec or sub-issue and cites its ID.
  - id: APP-002
    statement:
      Build only what these sections state. If a value is empty or ambiguous, ask the owner and record the answer in
      decisions.json; never infer product decisions.
  - id: APP-003
    statement: Classify every new file into a layer from architecture.building_blocks before creating it.
  - id: APP-004
    statement: Every read and write is checked for identity, tenant and permission on the server.
  - id: APP-005
    statement: When a doc changes, update the matching section here in the same change.
