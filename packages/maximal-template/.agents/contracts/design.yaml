# Machine-readable mirror of the docs listed in derived_from. Each block's `source` is the doc section it translates.
schema_version: "1.1"
kind: agent_contract
id: design
status: template
status_values:
  - template
  - draft
  - approved
status_note: template until the owner approves the docs; then draft → approved. Agents must not build from a template contract.
responsibility: How the app looks, reads and behaves.
derived_from:
  - context/docs/Design.md
rules:
  - id: DES-001
    statement: Use design tokens only; no raw colors, spacing or font values in components.
  - id: DES-002
    statement: Every screen has loading, empty, error and success states.
  - id: DES-003
    statement: Meet WCAG 2.2 AA in light and dark themes.
  - id: DES-004
    statement: Copy lives in content/; analytics events carry no PII.
brand_and_visual_principles:
  source: context/docs/Design.md#brand-and-visual-principles
  brand_color: ""
  typography: ""
  principles: []
design_tokens:
  source: context/docs/Design.md#design-tokens
  groups:
    - group: color
      defined_in: theme CSS variables
      themes:
        - light
        - dark
components:
  source: context/docs/Design.md#components
  base: shadcn/ui in components/ui
  app_specific: []
page_inventory_and_layouts:
  source: context/docs/Design.md#page-inventory-and-layouts
  pages:
    - route: ""
      purpose: ""
      layout: ""
      visible_to: []
key_flows_and_states:
  source: context/docs/Design.md#key-flows-and-states
  screens:
    - screen: ""
      loading: ""
      empty: ""
      error: ""
      success: ""
accessibility:
  source: context/docs/Design.md#accessibility
  target: WCAG 2.2 AA
  requirements:
    - keyboard access and visible focus
    - AA contrast in both themes
    - labelled inputs; announced errors
responsive_behavior:
  source: context/docs/Design.md#responsive-behavior
  breakpoints: []
  rules: []
content_and_voice:
