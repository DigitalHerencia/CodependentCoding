# Machine-readable mirror of the docs listed in derived_from. Each block's `source` is the doc section it translates.
schema_version: "1.1"
kind: agent_contract
id: validation
status: template
status_values:
  - template
  - draft
  - approved
status_note: template until the owner approves the docs; then draft → approved. Agents must not build from a template contract.
responsibility: "How work is proven done: checks, budgets, gates and evidence."
derived_from:
  - context/docs/tech-requirements.md
  - context/docs/AUTH.md
rules:
  - id: VAL-001
    statement: A spec is done only when every acceptance criterion has recorded evidence in progress.json.
  - id: VAL-002
    statement: Record only checks that were actually run, with the command and result. Never report an unrun check as passing.
  - id: VAL-003
    statement: A new regression test must fail before the fix and pass after it.
  - id: VAL-004
    statement: "Gate specs (cadence: gate) close only with owner approval recorded in decisions.json."
  - id: VAL-005
    statement: Fix the cause of a lint, type or test failure; never disable a rule or skip a test to pass.
tooling_and_code_quality:
  source: context/docs/tech-requirements.md#tooling-and-code-quality
  checks:
    format: pnpm format:check
    lint: pnpm lint
    typecheck: pnpm typecheck
    build: pnpm build
    governance: pnpm governance:validate
  required_clis: []
  required_mcp_servers: []
testing_strategy:
  source: context/docs/tech-requirements.md#testing-strategy
  suites:
    - name: unit
      command: pnpm test
      runs: local, before release
    - name: rls
      command: pnpm test:rls
      runs: local, disposable database
    - name: e2e
      command: pnpm test:e2e
      runs: local, before release
cicd_and_deployment:
  source: context/docs/tech-requirements.md#cicd-and-deployment
  ci_on: pull_request
  ci_checks:
    - format
    - lint
    - typecheck
    - build
  deploys: hosting git integration; preview per PR, production on main
  migrations: ""
  rollback: ""
performance:
  source: context/docs/tech-requirements.md#performance
  budgets:
    lcp_p75_s: 2.5
    inp_p75_ms: 200
    cls_p75: 0.1
    server_action_p95_ms: null
    first_load_js_kb: null
threat_model_and_security_review:
  source: context/docs/AUTH.md#threat-model-and-security-review
  threats:
    - threat: cross-tenant data access
      control: rls + server authz
      verified_by: pnpm test:rls
evidence:
  ledger: .agents/execution/progress.json
  entry_fields:
    - command
    - result
    - date
    - spec_id
