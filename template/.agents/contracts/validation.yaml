schema_version: 1
file: .agents/contracts/validation.yaml
product: The Maximal Template
status: active
purpose: Deterministic validation and evidence policy for the active Maximal Template repair/build sequence.

authority:
  type: machine_interpretation
  human_sources:
    - context/docs/tech-requirements.md
    - context/docs/architecture.md
    - context/specs
  may_override_human_sources: false

evidence_states:
  - executed
  - skipped
  - blocked
  - inferred

evidence_rules:
  unexecuted_check_may_be_reported_as_passed: false
  prior_revision_pass_is_current_revision_pass: false
  build_proves_runtime_authorization: false
  ui_visibility_proves_rls: false
  static_inspection_proves_live_provider_configuration: false

repository_commands:
  format_check: pnpm format:check
  lint: pnpm lint
  typecheck: pnpm typecheck
  prisma_validate: pnpm prisma:validate
  build: pnpm build
  aggregate_validate: pnpm validate

default_validation:
  strategy: narrowest_relevant_first
  do_not_invent_parallel_test_system: true
  broad_build_when_required_by_active_spec_or_completion_gate: true

architecture_checks:
  public_static_pages:
    route_group: app/(public)
    meaningless_feature_wrapper: forbidden
  marketing:
    means_business_domain_only: true
  feature_ui_import:
    default: forbidden
    react_hook_form_feature_exception: allowed
  blocks:
    must_be_pure_ui: true
    react_hook_form: forbidden
    provider_sdk: forbidden
    persisted_io: forbidden
  fetchers:
    persisted_reads_only: true
    writes: forbidden
  actions:
    ordinary_crud_writes_only: true
  webhook:
    http_lifecycle_root: app/api
  provider_exceptions:
    Clerk: lib/auth
    Neon: lib/db
    Prisma: lib/db_and_root_prisma
  route_url_checks:
    admin_segment_must_be_real: true
  public_demo:
    browse_requires_auth: false
    anonymous_protected_write: forbidden

high_risk_boundaries:
  - authentication
  - authorization
  - tenant_scope
  - rls
  - webhooks
  - provider_reconciliation
  - money_or_billing
  - destructive_migrations

completion_requirements:
  - active_spec_acceptance_is_mapped_to_evidence
  - no_known_contradiction_with_higher_authority
  - validation_results_record_actual_execution_state
  - remaining_failures_are_explicit
