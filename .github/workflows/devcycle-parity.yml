# CI Guard for DevCycle List Parity
# Ensures dist/.github/global.instructions.md DevCycle list matches
# docs/TECH_REQUIREMENTS.md §6 canonical table.
#
# Closes #12
# Requirements: Tech Requirements §10, SPEC-DEV §2

name: DevCycle Parity Check

on:
  push:
    paths:
      - 'dist/.github/global.instructions.md'
      - 'docs/TECH_REQUIREMENTS.md'
  pull_request:
    paths:
      - 'dist/.github/global.instructions.md'
      - 'docs/TECH_REQUIREMENTS.md'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  check-parity:
    name: Validate DevCycle List Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check DevCycle parity
        shell: bash
        run: |
          set -euo pipefail

          INSTRUCTIONS_FILE="dist/.github/global.instructions.md"
          TECH_REQ_FILE="docs/TECH_REQUIREMENTS.md"
          EXIT_CODE=0

          echo "🔍 Checking DevCycle list parity..."
          echo ""

          # Verify files exist
          if [ ! -f "$INSTRUCTIONS_FILE" ]; then
            echo "❌ $INSTRUCTIONS_FILE not found"
            exit 1
          fi

          if [ ! -f "$TECH_REQ_FILE" ]; then
            echo "❌ $TECH_REQ_FILE not found"
            exit 1
          fi

          echo "📄 Found $INSTRUCTIONS_FILE"
          echo "📄 Found $TECH_REQ_FILE"
          echo ""

          # Extract DevCycle names from global.instructions.md
          # Format: numbered list under "## Development Phases" section
          # Lines: "1. initialization" through "18. updates"
          echo "🔍 Parsing DevCycle names from $INSTRUCTIONS_FILE..."
          
          # Extract section between "## Development Phases" and "## Artifact Types"
          # Filter for numbered list items, then normalize:
          # - Remove number prefix
          # - Lowercase
          # - Convert unicode hyphens (‑–—) to ASCII hyphen
          # - Convert slashes to hyphens
          # - Trim trailing whitespace
          INSTRUCTIONS_CYCLES=$(awk '/^## Development Phases/,/^## Artifact Types/' "$INSTRUCTIONS_FILE" | \
            grep -E '^[0-9]+\. ' | \
            sed 's/^[0-9]*\. //' | \
            tr '[:upper:]' '[:lower:]' | \
            sed 's/[‑–—]/-/g' | \
            sed 's/\//-/g' | \
            sed 's/[[:space:]]*$//' | \
            sort)

          # Extract DevCycle names from TECH_REQUIREMENTS.md §6 table
          # Format: | # | DevCycle | Purpose |
          # Table rows start with: | 1 | Initialization | ...
          echo "🔍 Parsing canonical DevCycle names from $TECH_REQ_FILE §6..."
          
          # Extract table rows with numeric IDs (skip header and separator)
          # Column 3 contains the DevCycle name
          # Normalize consistently with instructions parser:
          # - Trim whitespace
          # - Lowercase
          # - Convert spaces to hyphens
          # - Convert slashes to hyphens
          # - Convert unicode hyphens to ASCII hyphen
          CANONICAL_CYCLES=$(grep -E '^\| *[0-9]+ *\|' "$TECH_REQ_FILE" | \
            awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $3); print $3}' | \
            tr '[:upper:]' '[:lower:]' | \
            sed 's/[[:space:]]/-/g' | \
            sed 's/\//-/g' | \
            sed 's/[‑–—]/-/g' | \
            sort)

          echo ""
          echo "📋 DevCycles from global.instructions.md:"
          echo "$INSTRUCTIONS_CYCLES" | nl
          echo ""
          echo "📋 Canonical DevCycles from TECH_REQUIREMENTS.md §6:"
          echo "$CANONICAL_CYCLES" | nl
          echo ""

          # Get count for dynamic messaging
          CANONICAL_COUNT=$(echo "$CANONICAL_CYCLES" | wc -l | tr -d ' ')
          INSTRUCTIONS_COUNT=$(echo "$INSTRUCTIONS_CYCLES" | wc -l | tr -d ' ')

          # Compare lists
          echo "🔄 Comparing lists..."
          echo "   (Canonical: $CANONICAL_COUNT DevCycles, Instructions: $INSTRUCTIONS_COUNT DevCycles)"
          echo ""

          # Create temp files for diff
          TEMP_DIR=$(mktemp -d)
          echo "$INSTRUCTIONS_CYCLES" > "$TEMP_DIR/instructions.txt"
          echo "$CANONICAL_CYCLES" > "$TEMP_DIR/canonical.txt"

          # Check for differences
          if diff -q "$TEMP_DIR/instructions.txt" "$TEMP_DIR/canonical.txt" > /dev/null 2>&1; then
            echo "✅ DevCycle lists match!"
          else
            echo "❌ DevCycle list mismatch detected!"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "DIFF (< = global.instructions.md, > = TECH_REQUIREMENTS.md §6):"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            diff "$TEMP_DIR/instructions.txt" "$TEMP_DIR/canonical.txt" || true
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""

            # Show items only in instructions
            ONLY_INSTRUCTIONS=$(comm -23 "$TEMP_DIR/instructions.txt" "$TEMP_DIR/canonical.txt")
            if [ -n "$ONLY_INSTRUCTIONS" ]; then
              echo "❌ In global.instructions.md but NOT in canonical list:"
              echo "$ONLY_INSTRUCTIONS" | sed 's/^/   • /'
              echo ""
            fi

            # Show items only in canonical
            ONLY_CANONICAL=$(comm -13 "$TEMP_DIR/instructions.txt" "$TEMP_DIR/canonical.txt")
            if [ -n "$ONLY_CANONICAL" ]; then
              echo "❌ In canonical list but NOT in global.instructions.md:"
              echo "$ONLY_CANONICAL" | sed 's/^/   • /'
              echo ""
            fi

            EXIT_CODE=1
          fi

          # Cleanup
          rm -rf "$TEMP_DIR"

          # Print update instructions
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📚 Update Instructions"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "The canonical DevCycle list is defined in:"
          echo "  docs/TECH_REQUIREMENTS.md §6 (Canonical DevCycle Table)"
          echo ""
          echo "To update DevCycle list:"
          echo "  1. Update docs/TECH_REQUIREMENTS.md §6 with the new canonical list"
          echo "  2. Update dist/.github/global.instructions.md to match"
          echo "  3. Ensure both files have matching DevCycle names (currently $CANONICAL_COUNT)"
          echo "  4. Use the canonical DevCycle name format (e.g., 'Code Review') as defined in docs/TECH_REQUIREMENTS.md §6"
          echo "  5. Update devcycles.config.json if manifest entries are affected"
          echo ""
          echo "References:"
          echo "  • Tech Requirements §6 - Canonical DevCycle Table"
          echo "  • Tech Requirements §10 - Validation & Traceability"
          echo "  • SPEC-DEV §2 - DevCycle governance"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          exit $EXIT_CODE
