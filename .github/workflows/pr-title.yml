# The PR title becomes the squash commit on main, so it must be a Conventional Commit.
# No checkout and no install: this takes a couple of seconds.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9-]*\))?!?: [^ ].{0,99}$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title must look like 'type(scope): summary', e.g. 'fix(cli): ask for the Neon URL'. Types: feat fix docs style refactor perf test build ci chore revert. Got: $TITLE"
            exit 1
          fi
