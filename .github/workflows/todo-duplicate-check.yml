# TODO.md Duplicate Detection Workflow
#
# This workflow validates that TODO.md contains no duplicate entries.
# Duplicates violate the "one entry per work item" expectation from PRD §5.3.
#
# References:
# - PRD §5.3 (DevCycle Governance)
# - Tech Requirements §7 (Workflow & Governance)
# - SPEC-DEV §4 / SPEC-OBS §3 (Idempotency Guarantee)
# - Issue #71

name: TODO Duplicate Check

on:
  push:
    paths:
      - 'TODO.md'
  pull_request:
    paths:
      - 'TODO.md'
  workflow_dispatch:

# Set minimal permissions for the GITHUB_TOKEN
permissions:
  contents: read

jobs:
  check-duplicates:
    name: Check for Duplicate TODO Entries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Check for duplicate TODO entries
        run: |
          echo "📋 Checking TODO.md for duplicate entries..."
          echo ""

          # Parse TODO.md and extract all table rows with status indicators
          # Match lines that start with | ☐ or | ☑ or | [x]
          grep -E '^\|\s*[☐☑\[]' TODO.md > /tmp/todo-entries.txt || true

          if [ ! -s /tmp/todo-entries.txt ]; then
            echo "⚠️  No TODO entries found or TODO.md is empty"
            exit 0
          fi

          # Extract just the item description (second column)
          # Normalize by: lowercasing, removing extra whitespace, removing special chars
          awk -F'|' '{print tolower($3)}' /tmp/todo-entries.txt | \
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | \
            sed 's/[[:space:]]\+/ /g' | \
            sort > /tmp/todo-items-normalized.txt

          # Find duplicates
          sort /tmp/todo-items-normalized.txt | uniq -d > /tmp/todo-duplicates.txt

          if [ -s /tmp/todo-duplicates.txt ]; then
            echo "❌ DUPLICATE TODO ENTRIES FOUND!"
            echo ""
            echo "The following entries appear more than once:"
            echo "----------------------------------------"
            cat /tmp/todo-duplicates.txt
            echo "----------------------------------------"
            echo ""
            echo "📚 References:"
            echo "   - PRD §5.3: One entry per work item expected"
            echo "   - Tech Requirements §7: Duplicate entries are inconsistent evidence"
            echo "   - SPEC-DEV §4 / SPEC-OBS §3: Idempotency guarantee violated"
            echo ""
            echo "🔧 To fix: Remove duplicate entries from TODO.md, keeping the completed (☑) version."
            echo "   Or run: node -e \"import('./dist/genaiscript/shared/todoUpdater.js').then(m => console.log(m.removeDuplicates()))\""
            exit 1
          else
            echo "✅ No duplicate TODO entries found."
            echo ""
            echo "📊 Total entries checked: $(wc -l < /tmp/todo-entries.txt)"
          fi

      - name: Summary
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "## ✅ TODO Duplicate Check Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No duplicate entries found in TODO.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ TODO Duplicate Check Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Duplicate entries were found in TODO.md. See job logs for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### References" >> $GITHUB_STEP_SUMMARY
            echo "- PRD §5.3: One entry per work item expected" >> $GITHUB_STEP_SUMMARY
            echo "- Tech Requirements §7: Duplicate entries are inconsistent evidence" >> $GITHUB_STEP_SUMMARY
            echo "- SPEC-DEV §4 / SPEC-OBS §3: Idempotency guarantee violated" >> $GITHUB_STEP_SUMMARY
          fi
