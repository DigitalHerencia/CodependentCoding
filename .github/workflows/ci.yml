# Current factory focus: validate changed Maximal Template code only.
# No builds, tests, migrations, dev servers, deployments, or CI autofixes.
name: Template CI

on:
  pull_request:
    paths:
      - "packages/maximal-template/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: template-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  template:
    name: Changed-file checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/maximal-template
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_placeholder
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_placeholder
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed template files
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- packages/maximal-template/ |
            sed 's#^packages/maximal-template/##' > "$RUNNER_TEMP/changed-template.txt"
          if [[ -s "$RUNNER_TEMP/changed-template.txt" ]]; then
            echo 'any=true' >> "$GITHUB_OUTPUT"
          else
            echo 'any=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '\.(ts|tsx|js|jsx|mjs|cjs|prisma)$|^(package\.json|pnpm-lock\.yaml|tsconfig\.json|next\.config\.[cm]?[jt]s|prisma\.config\.ts)$' "$RUNNER_TEMP/changed-template.txt"; then
            echo 'types=true' >> "$GITHUB_OUTPUT"
          else
            echo 'types=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.any == 'true'
        with:
          package_json_file: packages/maximal-template/package.json
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.any == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: packages/maximal-template/pnpm-lock.yaml
      - name: Install template dependencies
        if: steps.changes.outputs.any == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint changed files
        if: steps.changes.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/changed-template.txt"
          pnpm exec prettier --check --ignore-unknown "${files[@]}"
          mapfile -t code < <(grep -E '\.(js|jsx|ts|tsx|mjs|cjs|mts|cts)$' "$RUNNER_TEMP/changed-template.txt" || true)
          if (("${#code[@]}")); then
            # Baseline ESLint config is self-contained; the optional factory
            # doctrine plugin needs sibling packages not installed here.
            pnpm exec eslint --max-warnings=0 "${code[@]}"
          fi

      - name: Typecheck
        if: steps.changes.outputs.types == 'true'
        run: pnpm typecheck
