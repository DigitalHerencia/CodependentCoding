name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  generator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.1.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
