# One workflow, scoped to what changed (tech-requirements.md §11).
# A docs-only change runs a format check and nothing else; root and template run
# only when their files change; e2e, the database tests and the template build run
# only when the files they cover change. Vercel builds and deploys the site itself.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      root: ${{ steps.scope.outputs.root }}
      root_code: ${{ steps.scope.outputs.root_code }}
      root_tests: ${{ steps.scope.outputs.root_tests }}
      cli: ${{ steps.scope.outputs.cli }}
      template: ${{ steps.scope.outputs.template }}
      template_eslint: ${{ steps.scope.outputs.template_eslint }}
      template_schema: ${{ steps.scope.outputs.template_schema }}
      template_e2e: ${{ steps.scope.outputs.template_e2e }}
      template_db: ${{ steps.scope.outputs.template_db }}
      template_build: ${{ steps.scope.outputs.template_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Manual runs, new branches and edits to this file check everything.
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            files="$(git ls-files)"
          else
            files="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
            if grep -qx '.github/workflows/ci.yml' <<<"$files"; then files="$(git ls-files)"; fi
          fi
          list="$RUNNER_TEMP/changed.txt"
          printf '%s\n' "$files" > "$list"
          echo "Changed files ($(wc -l < "$list")):"; head -n 100 "$list" | sed 's/^/  /'

          has() { grep -qE "$1" "$list" && echo true || echo false; }
          # Text and repo settings only: the format check covers them.
          docs='(\.md$|^LICENSE$|^\.gitmessage$|^context/|^\.claude/execution/|^\.github/(ISSUE_TEMPLATE/|labels\.yml$|dependabot\.yml$))'

          tests=""
          root_config='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|vitest\.config\.ts|tsconfig\.json)$'
          if grep -qE "$root_config" "$list"; then
            tests="tests"
          else
            grep -qE '^(packages/cli/|tests/cli/|template/scripts/|template/hipster\.modules\.json$)' "$list" && tests+=" tests/cli"
            grep -qE '^(plugin/|tests/plugin/|scripts/github/|scripts/plugin-doctrine\.mjs$|\.claude/hooks/)' "$list" && tests+=" tests/plugin"
            grep -qE '^(scripts/doctrine-check\.mjs$|tests/doctrine/|\.claude/contracts/|template/eslint/)' "$list" && tests+=" tests/doctrine"
          fi

          {
            echo "root=$(grep -qvE '^template/' "$list" && echo true || echo false)"
            echo "root_code=$([ -n "$(grep -vE "$docs" "$list" | grep -vE '^template/' || true)" ] && echo true || echo false)"
            echo "root_tests=${tests# }"
            echo "cli=$(has '^(packages/cli/|template/scripts/|template/hipster\.modules\.json$)')"
            echo "template=$([ -n "$(grep -E '^template/' "$list" | grep -vE '\.md$' || true)" ] && echo true || echo false)"
            echo "template_eslint=$(has '^template/eslint/')"
            echo "template_schema=$(has '^template/(prisma/|hipster\.modules\.json$)')"
            echo "template_e2e=$(has '^template/(app|components|features|lib|hooks|tests/e2e)/|^template/(proxy\.ts|next\.config\.ts|playwright\.config\.ts|package\.json|pnpm-lock\.yaml)$')"
            echo "template_db=$(has '^template/(prisma/|tests/rls/|lib/db/)|^template/scripts/(rls-sql|db-init)\.mjs$')"
            echo "template_build=$(has '^template/(next\.config\.ts|package\.json|pnpm-lock\.yaml|postcss\.config\.mjs|tsconfig\.json)$')"
          } | tee -a "$GITHUB_OUTPUT"

  root:
    name: Factory (root)
    needs: changes
    # Template scripts, manifest and eslint rules are also exercised by root tests.
    if: needs.changes.outputs.root == 'true' || needs.changes.outputs.root_tests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            template/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The CLI, plugin and doctrine tests load the template's scripts and packages.
      - if: needs.changes.outputs.root_tests != '' || needs.changes.outputs.cli == 'true'
        run: pnpm --dir template install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # `!cancelled()` keeps every check reporting after one fails.
      - run: pnpm format:check
      - if: ${{ !cancelled() && needs.changes.outputs.root_code == 'true' }}
        run: pnpm lint
      - if: ${{ !cancelled() && needs.changes.outputs.root_code == 'true' }}
        run: pnpm typecheck
      - if: ${{ !cancelled() && needs.changes.outputs.root_code == 'true' }}
        run: pnpm doctrine:check
      - name: Tests for the changed areas
        if: ${{ !cancelled() && needs.changes.outputs.root_tests != '' }}
        run: pnpm exec vitest run ${{ needs.changes.outputs.root_tests }}
      - name: CLI builds and runs
        if: ${{ !cancelled() && needs.changes.outputs.cli == 'true' }}
        run: |
          pnpm cli:build
          node packages/cli/dist/cli.mjs --version

  template:
    name: Maximal Template
    needs: changes
    if: needs.changes.outputs.template == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: template
    env:
      # Placeholders so Prisma, Clerk and the env schemas load; nothing is contacted.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_placeholder
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: template/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: template/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - if: ${{ !cancelled() }}
        run: pnpm lint
      - if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: Module manifest, ownership and env
        if: ${{ !cancelled() }}
        run: |
          pnpm check:modules
          pnpm check:ownership
          pnpm check:env
      - if: ${{ !cancelled() && needs.changes.outputs.template_eslint == 'true' }}
        run: pnpm doctrine:test
      - if: ${{ !cancelled() && needs.changes.outputs.template_schema == 'true' }}
        run: pnpm check:schema-modules
      # The whole unit suite takes about 3 seconds, so it is not narrowed further.
      - if: ${{ !cancelled() }}
        run: pnpm test
      - name: E2E smoke (Playwright, HTTP only)
        if: ${{ !cancelled() && needs.changes.outputs.template_e2e == 'true' }}
        run: pnpm test:e2e
      - if: ${{ !cancelled() && needs.changes.outputs.template_build == 'true' }}
        run: pnpm build

  template-db:
    name: Template database (RLS)
    needs: changes
    if: needs.changes.outputs.template_db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: template
    # A throwaway Postgres inside the runner: no cloud database is created.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: template/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: template/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Migrates, applies prisma/rls/*.sql, seeds two organizations and probes every
      # tenant table as a NOBYPASSRLS role.
      - run: pnpm test:rls
