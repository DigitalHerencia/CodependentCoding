name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  root:
    name: Factory (root)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4 # version from package.json packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            template/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The CLI composition tests load the template's scripts (zod, prettier).
      - run: pnpm --dir template install --frozen-lockfile
      # Root has no continue-on-error (CC-004). `!cancelled()` keeps every check reporting
      # even when an earlier one fails, so one red step does not hide the others.
      - run: pnpm format:check
      - run: pnpm lint
        if: ${{ !cancelled() }}
      - run: pnpm typecheck
        if: ${{ !cancelled() }}
      - run: pnpm test
        if: ${{ !cancelled() }}
      - name: CLI builds and runs
        if: ${{ !cancelled() }}
        run: |
          pnpm cli:build
          node packages/cli/dist/cli.mjs --version
          node packages/cli/dist/cli.mjs --help

  template:
    name: Maximal Template
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: template
    env:
      # Placeholder values so Prisma/Next can load config; no network access to these.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: template/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: template/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm doctrine:test
      - run: pnpm check:modules
      - run: pnpm check:ownership
      - run: pnpm check:env
      - run: pnpm prisma:generate
      - run: pnpm check:schema-modules
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  compose:
    name: Compose (each add-on alone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: template
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: template/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: template/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # base + each add-on, and base alone: prisma generate, typecheck, lint
      - run: pnpm check:compose

  rls:
    name: RLS (Neon branch)
    # Needs the Neon integration's NEON_API_KEY secret and NEON_PROJECT_ID variable;
    # fork PRs get no secrets, so they skip this job.
    if: vars.NEON_PROJECT_ID != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: template
    env:
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: template/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: template/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - id: expiry
        run: echo "at=$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: branch
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci/rls-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ steps.expiry.outputs.at }}
      # The owner URL comes from the Neon API inside this step and is masked before
      # anything else runs, so no connection string reaches the log.
      - name: Create app_user and export connection strings
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.branch.outputs.branch_id }}
        run: |
          set -euo pipefail
          api="https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID"
          auth=(-fsS -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json")
          database="$(curl "${auth[@]}" "$api/branches/$BRANCH_ID/databases" | jq -r '.databases[0].name')"
          owner_role="$(curl "${auth[@]}" "$api/branches/$BRANCH_ID/databases" | jq -r '.databases[0].owner_name')"
          owner_url="$(curl "${auth[@]}" --get "$api/connection_uri" \
            --data-urlencode "branch_id=$BRANCH_ID" \
            --data-urlencode "database_name=$database" \
            --data-urlencode "role_name=$owner_role" | jq -r '.uri')"
          echo "::add-mask::$owner_url"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          psql "$owner_url" -v ON_ERROR_STOP=1 -q \
            -c "CREATE ROLE app_user LOGIN NOBYPASSRLS PASSWORD '$password'"
          app_url="$(node -e 'const u = new URL(process.argv[1]); u.username = "app_user"; u.password = process.argv[2]; process.stdout.write(u.href)' "$owner_url" "$password")"
          echo "::add-mask::$app_url"
          {
            echo "DATABASE_URL_TEST=$owner_url"
            echo "DATABASE_URL_TEST_APP=$app_url"
          } >> "$GITHUB_ENV"
      # The suite migrates as the owner (prisma migrate deploy + prisma/rls/*.sql),
      # seeds two organizations, then probes every tenant table connected as app_user.
      - run: pnpm test:rls
      - name: Delete Neon branch
        if: always() && steps.branch.outputs.branch_id != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.branch.outputs.branch_id }}
        run: |
          curl -fsS -o /dev/null -X DELETE \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID"

  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      compose: ${{ steps.diff.outputs.compose }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pushes to main always run the matrix; PRs only when the template or the CLI changed.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ] || git diff --name-only "$BASE" HEAD | grep -qE '^(template|packages/cli)/|^\.github/workflows/ci\.yml$'; then
            echo "compose=true" >> "$GITHUB_OUTPUT"
          else
            echo "compose=false" >> "$GITHUB_OUTPUT"
          fi

  presets:
    name: Preset ${{ matrix.preset }}
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        preset:
          - blank
          - crm
          - projects
          - support
          - marketing
          - invoicing
          - social
          - ai
          - portal
          - admin
          - all
    env:
      # Placeholders so Prisma, Clerk and the env schemas load at build; nothing is contacted.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_placeholder
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      SENDGRID_API_KEY: SG.placeholder
      SENDGRID_FROM_EMAIL: ci@example.com
      # Inside template/: turbopack rejects node_modules symlinks outside its root.
      APP: template/.sandbox/${{ matrix.preset }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            template/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The CLI loads the template's scripts, Prettier and Prisma.
      - run: pnpm --dir template install --frozen-lockfile
      - name: hipster-stack compose
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          if [ "$PRESET" = all ]; then selection=(--all); else selection=(--preset "$PRESET"); fi
          pnpm cli compose "$APP" "${selection[@]}"
      # Composition prunes package.json, so the copied lockfile is updated, not frozen.
      - run: pnpm --dir "$APP" install --no-frozen-lockfile
      - run: pnpm --dir "$APP" lint
      - run: pnpm --dir "$APP" typecheck
      - run: pnpm --dir "$APP" build
