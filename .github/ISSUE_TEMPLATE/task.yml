name: Task
description: Chore, refactor, test, docs, CI, or spike
title: "chore(<area>): "
projects: ["DigitalHerencia/19"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [chore, refactor, perf, test, docs, build, ci, spike]
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [governance, site, template, modules, cli, plugin, ci]
    validations: { required: true }
  - type: input
    id: docs
    attributes:
      label: Docs / spec
      description: The doc section or spec file this traces to. New planned work also gets a `context/specs/issues/CC-NNN-*.md` file (next free number).
      placeholder: "context/docs/AUTH.md §4 · context/specs/issues/CC-045-*.md"
    validations: { required: true }
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        - [ ]
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations: { required: true }
  - type: textarea
    id: validation
    attributes:
      label: Validation
      render: powershell
  - type: input
    id: timebox
    attributes:
      label: Timebox (spikes only)
      placeholder: "2h"
