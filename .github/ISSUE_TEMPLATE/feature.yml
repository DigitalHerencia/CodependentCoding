name: Feature
description: A new capability for the site, template, modules, CLI, or plugin
title: "feat(<area>): "
labels: ["type:feature"]
projects: ["DigitalHerencia/19"]
body:
  - type: markdown
    attributes:
      value: "Title is a Conventional Commit, e.g. `feat(cli): ask for the Clerk keys`. The PR that does the work uses the same style and says `Closes #<this issue>`."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [governance, site, template, modules, cli, plugin, ci]
    validations: { required: true }
  - type: input
    id: docs
    attributes:
      label: Docs / spec
      description: The doc section or spec file this traces to. New planned work also gets a `context/specs/issues/CC-NNN-*.md` file (next free number).
      placeholder: "context/docs/AUTH.md §4 · context/specs/issues/CC-045-*.md"
    validations: { required: true }
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What and why, in two or three sentences.
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Checklist of concrete changes.
      value: |
        - [ ]
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, checkable outcomes.
      value: |
        - [ ]
    validations: { required: true }
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Commands that prove it.
      render: powershell
  - type: input
    id: depends
    attributes:
      label: Depends on
      placeholder: "CC-012, CC-018"
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [p0, p1, p2, p3]
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: [xs, s, m, l, xl]
  - type: checkboxes
    id: doctrine
    attributes:
      label: Doctrine
      options:
        - label: This changes a CC-* rule (update Architecture.md, validation.yaml, and template/eslint in the same PR)
