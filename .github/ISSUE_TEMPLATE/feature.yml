name: Feature
description: A new capability for the site, template, modules, CLI, or plugin
title: "CC-NNN · "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: Planned work should also exist as `context/specs/issues/CC-NNN-*.md`. Use the next free CC number.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [governance, site, template, modules, cli, plugin, ci]
    validations: { required: true }
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What and why, in two or three sentences.
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Checklist of concrete changes.
      value: |
        - [ ]
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, checkable outcomes.
      value: |
        - [ ]
    validations: { required: true }
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Commands that prove it.
      render: powershell
  - type: input
    id: depends
    attributes:
      label: Depends on
      placeholder: "CC-012, CC-018"
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [p0, p1, p2, p3]
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: [xs, s, m, l, xl]
  - type: checkboxes
    id: doctrine
    attributes:
      label: Doctrine
      options:
        - label: This changes a CC-* rule (update Architecture.md, validation.yaml, and template/eslint in the same PR)
